<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form th:action="@{/in/create}" method="post">
    <h1>アンケートフォーム</h1>
    名前：<br>
    <input type="text" name="name"><br>
    メール：<br>
    <input type="text" name="email"><br>
    性別：<br>
    <input type="radio" name="gender" value="男" checked>男<br>
    <input type="radio" name="gender" value="女">女<br><br>
    趣味：<br>
    <div th:each="hobby:${hobbyMap}">
        <input type="checkbox" name="hobbyList" th:value="${hobby.key}" th:text="${hobby.value}">
        </div><br><br>

    
    <div>
        <label for="fwList">好きな言葉：</label><br>
        <select name="fwList">
            <option th:each="fw : ${fwMap}" th:value="${fw.key}" th:text="${fw.value}">dummy</option>
        </select>
    </div><br>
    その他：<br>
    <textarea name="other" row="5" cols="50"></textarea><br><br>
    <button>送信</button>

</form>
    
</body>
</html>
